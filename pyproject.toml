[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capuccino-vainilla"
version = "1.0.0"
description = "Conector bidireccional Odoo Enterprise ⇄ WordPress/WooCommerce para Pinnacle."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Pinnacle" }]

dependencies = [
    "woocommerce>=3.0.0",      # WooCommerce REST API (oficial)
    "python-dotenv>=1.0.1",    # Carga de credenciales desde .env
    "requests>=2.32.0",        # Transporte HTTP
    "fastapi>=0.110.0",        # Servidor de webhooks
    "uvicorn[standard]>=0.29.0",  # ASGI server para FastAPI
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",           # Requerido por fastapi.testclient
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-requests",
]

[project.scripts]
capuccino-vainilla = "capuccino_vainilla.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capuccino_vainilla = ["py.typed"]
"capuccino_vainilla.viewer" = ["static/*.html"]

# --------------------------------------------------------------------------- #
#  Herramientas de calidad
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["capuccino_vainilla"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# La CLI y el arranque de servidor se prueban manualmente / e2e.
omit = ["*/cli.py", "*/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # FastAPI usa llamadas en defaults (Depends, etc.)

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true   # woocommerce no provee stubs de tipos
packages = ["capuccino_vainilla"]
mypy_path = "src"
