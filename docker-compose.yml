# Orquestación local del conector.
#   docker compose up webhook            -> levanta el servidor de webhooks
#   docker compose run --rm sync         -> corre una sincronización de catálogo
services:
  webhook:
    build: .
    image: capuccino-vainilla:latest
    env_file: .env
    command: ["serve"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Servicio bajo demanda para sincronizar el catálogo (no se levanta con `up`).
  sync:
    build: .
    image: capuccino-vainilla:latest
    env_file: .env
    command: ["sync-catalog"]
    profiles: ["tools"]
    restart: "no"

  # --- Entorno de prueba WooCommerce (solo con --profile woo) ---
  woo-db:
    image: mariadb:11
    profiles: ["woo"]
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - woo-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  woo:
    image: wordpress:6-php8.3-apache
    profiles: ["woo"]
    depends_on:
      woo-db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: woo-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - woo-data:/var/www/html

  woo-cli:
    image: wordpress:cli-php8.3
    profiles: ["woo"]
    depends_on:
      woo:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: woo-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - woo-data:/var/www/html
    # Se usa con `docker compose run --rm woo-cli <args wp>`; no se levanta con `up`.

volumes:
  woo-db-data:
  woo-data:
